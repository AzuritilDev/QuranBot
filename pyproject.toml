[project]
name = "quranbot"
version = "2.4.12"
description = "An open-source discord bot for displaying Islamic scripture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adhanpy>=1.0.5",
    "asyncpg>=0.31.0",
    "discord>=2.3.2",
    "geopy>=2.4.1",
    "hiredis>=3.4.0",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "timezonefinder>=8.2.4",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
